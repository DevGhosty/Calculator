<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="calculator">
      <input type="text" class="displayBox" />
      <div class="buttons">
        <div class="row">
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button class="operation">+</button>
        </div>

        <div class="row">
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button class="operation">-</button>
        </div>

        <div class="row">
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button class="operation">x</button>
        </div>

        <div class="row">
          <button class="clear">C</button>
          <button>0</button>
          <button class="operation">=</button>
          <button class="operation">/</button>
        </div>
      </div>
    </div>
  </body>
</html>
